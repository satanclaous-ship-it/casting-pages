# XcodeGen fallback — only needed if Min30.xcodeproj won't open.
#   brew install xcodegen && cd min30-ios && xcodegen generate
name: Min30
options:
  bundleIdPrefix: com.satanclaous
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
  createIntermediateGroups: true

targets:
  Min30:
    type: application
    platform: iOS
    sources:
      - Min30
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.satanclaous.min30
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "30분 기록"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "말로 활동과 아이디어를 기록할 때 마이크를 씁니다."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "말한 내용을 글로 옮겨 기록에 넣습니다. 가능한 경우 기기 안에서 처리합니다."
