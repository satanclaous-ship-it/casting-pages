title: Casting
description: A spoken-affirmation ritual. 30-sec subconscious rewiring.
theme: jekyll-theme-cayman
url: https://satanclaous-ship-it.github.io
baseurl: /casting-pages

# Clean URLs without .html
permalink: /:title/

# Files to exclude from Jekyll build
exclude:
  - README.md
  - worker/        # Cloudflare Worker source — deployed separately, not a page

# tracker/ needs no config: its files carry no front matter, so Jekyll
# copies them verbatim instead of rendering them as pages.
