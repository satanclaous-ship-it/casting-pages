<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>북극성 인터뷰</title>
<style>
  :root {
    --bg: #07080d;
    --ink: #eef0f6;
    --dim: #8b90a3;
    --line: #1c1f2b;
    --you: #12141d;
    --accent: #cbb98a;
  }
  * { box-sizing: border-box; -webkit-text-size-adjust: 100%; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
      "Noto Sans KR", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.7;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 22px 20px 14px;
    border-bottom: 1px solid var(--line);
    text-align: center;
  }
  h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  header p {
    margin: 6px 0 0;
    font-size: 13px;
    color: var(--dim);
  }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px 8px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    -webkit-overflow-scrolling: touch;
  }
  .msg { margin: 0 0 22px; white-space: pre-wrap; word-break: break-word; }
  .msg.you {
    background: var(--you);
    border-radius: 14px;
    padding: 12px 15px;
    margin-left: auto;
    max-width: 85%;
    color: #d8dbe6;
  }
  .msg.guide { max-width: 100%; }
  .cursor {
    display: inline-block;
    width: 7px; height: 15px;
    background: var(--accent);
    opacity: 0.8;
    animation: blink 1.1s steps(2, start) infinite;
    vertical-align: -2px;
  }
  @keyframes blink { to { visibility: hidden; } }
  footer {
    border-top: 1px solid var(--line);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .modes { display: flex; gap: 6px; margin-bottom: 10px; }
  .modes button {
    flex: 1; padding: 9px 10px; font-size: 14px;
    background: var(--you); color: var(--dim); border: 1px solid var(--line);
  }
  .modes button.on { background: var(--accent); color: #0d0f14; border-color: var(--accent); font-weight: 600; }
  .modes button:disabled { opacity: 0.45; }
  #mic {
    width: 100%; padding: 18px 14px; font-size: 17px; border-radius: 14px;
    background: var(--you); color: var(--ink); border: 1px solid var(--line);
  }
  #mic.listening { background: #3b1f24; border-color: #d2555f; color: #ffd7db; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(210,85,95,0.18); } }
  .hint { font-size: 12px; color: var(--dim); margin-top: 6px; text-align: center; }
  textarea {
    flex: 1;
    resize: none;
    background: var(--you);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 13px;
    font: inherit;
    line-height: 1.55;
    max-height: 40vh;
    min-height: 46px;
  }
  textarea:focus { outline: none; border-color: #33384a; }
  button {
    font: inherit;
    font-size: 15px;
    border: none;
    border-radius: 12px;
    padding: 12px 18px;
    background: var(--accent);
    color: #12121a;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.35; cursor: default; }
  .status {
    font-size: 12.5px;
    color: var(--dim);
    text-align: center;
    padding: 6px 4px 0;
    min-height: 20px;
  }
  .done {
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    margin: 6px 0 22px;
    text-align: center;
  }
  .done p { margin: 0 0 14px; font-size: 14px; color: var(--dim); }
  .ghost {
    background: transparent;
    color: var(--dim);
    border: 1px solid var(--line);
    font-size: 13px;
    padding: 9px 14px;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>북극성 인터뷰</h1>
  <p id="subtitle">질문 여덟 개, 약 10분 — 매일 아침과 밤에 읽을 문장이 만들어져요</p>
</header>

<main id="log"></main>

<footer>
  <div id="doneBox" class="done hidden">
    <p id="doneText">인터뷰가 끝났어요.</p>
    <button id="copy" class="ghost">대화 전체 복사</button>
    <button id="reset" class="ghost">처음부터</button>
  </div>
  <div class="modes" id="modes">
    <button id="modeType" class="on" type="button">⌨️ 타이핑</button>
    <button id="modeVoice" type="button">🎤 말하기</button>
  </div>
  <div id="voiceBox" class="hidden">
    <button id="mic" type="button">🎤 눌러서 말하기</button>
    <div class="hint" id="voiceHint">말이 끝나면 다시 눌러요. 글로 바뀐 내용을 확인하고 보내기.</div>
  </div>
  <div class="row">
    <textarea id="input" rows="1" placeholder="편하게 적어 주세요" autocomplete="off"></textarea>
    <button id="send" disabled>보내기</button>
  </div>
  <div class="status" id="status">시작하는 중이에요…</div>
  <div style="text-align:center; padding-top:8px;">
    <button id="retry" class="ghost hidden">다시 시도</button>
  </div>
</footer>

<script>
(function () {
  var KEY = "north-star-web-v1";
  var log = document.getElementById("log");
  var input = document.getElementById("input");
  var send = document.getElementById("send");
  var status = document.getElementById("status");
  var doneBox = document.getElementById("doneBox");
  var doneText = document.getElementById("doneText");
  var retry = document.getElementById("retry");

  var params = new URLSearchParams(location.search);
  var language = params.get("lang") === "en" ? "English" : "Korean";
  var EN = language === "English";
  // Chrome strings only — the interview itself is generated in the language above.
  var T = EN ? {
    title: "North Star Interview",
    subtitle: "Eight questions, about ten minutes \u2014 the reading you will speak every morning and night",
    placeholder: "Write however it comes",
    send: "Send",
    starting: "Starting\u2026",
    listening: "Listening\u2026",
    retry: "Try again",
    copy: "Copy the whole conversation",
    reset: "Start over",
    endedPlaceholder: "The interview is over",
    done: "The interview is over.",
    doneMins: function (m) { return "The interview is over (about " + m + " min)."; },
    copied: "Copied. Send it over when you can.",
    modeType: "\u2328\ufe0f Type", modeVoice: "\ud83c\udfa4 Speak",
    micIdle: "\ud83c\udfa4 Tap to speak", micOn: "\u25cf Listening\u2026 tap again when you are done",
    voiceHint: "Tap again when you finish. Check the text, then send.",
    voiceUnsupported: "Voice input is not available in this browser \u2014 open the page in Safari or Chrome.",
    voiceDenied: "Microphone permission was declined. Typing still works.",
    confirmReset: "Start over from the beginning? This conversation will be gone.",
    header: "[North Star Interview \u2014 web]", started: "Started: ", finished: "Finished: ", took: "Took: about ", min: " min", turns: "Turns: ", me: "\u2500\u2500 me \u2500\u2500", ai: "\u2500\u2500 interview \u2500\u2500"
  } : {
    title: "\ubd81\uadf9\uc131 \uc778\ud130\ubdf0",
    subtitle: "\uc9c8\ubb38 \uc5ec\ub35f \uac1c, \uc57d 10\ubd84 \u2014 \ub9e4\uc77c \uc544\uce68\uacfc \ubc24\uc5d0 \uc77d\uc744 \ubb38\uc7a5\uc774 \ub9cc\ub4e4\uc5b4\uc838\uc694",
    placeholder: "\ud3b8\ud558\uac8c \uc801\uc5b4 \uc8fc\uc138\uc694",
    send: "\ubcf4\ub0b4\uae30",
    starting: "\uc2dc\uc791\ud558\ub294 \uc911\uc774\uc5d0\uc694\u2026",
    listening: "\ub4e3\uace0 \uc788\uc5b4\uc694\u2026",
    retry: "\ub2e4\uc2dc \uc2dc\ub3c4",
    copy: "\ub300\ud654 \uc804\uccb4 \ubcf5\uc0ac",
    reset: "\ucc98\uc74c\ubd80\ud130",
    endedPlaceholder: "\uc778\ud130\ubdf0\uac00 \ub05d\ub0ac\uc5b4\uc694",
    done: "\uc778\ud130\ubdf0\uac00 \ub05d\ub0ac\uc5b4\uc694.",
    doneMins: function (m) { return "\uc778\ud130\ubdf0\uac00 \ub05d\ub0ac\uc5b4\uc694 (\uc57d " + m + "\ubd84)."; },
    copied: "\ubcf5\uc0ac\ub410\uc5b4\uc694. \ubcf4\ub0b4\uc8fc\uc2dc\uba74 \ub3fc\uc694.",
    modeType: "\u2328\ufe0f \ud0c0\uc774\ud551", modeVoice: "\ud83c\udfa4 \ub9d0\ud558\uae30",
    micIdle: "\ud83c\udfa4 \ub20c\ub7ec\uc11c \ub9d0\ud558\uae30", micOn: "\u25cf \ub4e3\ub294 \uc911\u2026 \ub2e4 \ub9d0\ud558\uba74 \ub2e4\uc2dc \ub20c\ub7ec\uc694",
    voiceHint: "\ub9d0\uc774 \ub05d\ub098\uba74 \ub2e4\uc2dc \ub20c\ub7ec\uc694. \uae00\ub85c \ubc14\ub01c \ub0b4\uc6a9\uc744 \ud655\uc778\ud558\uace0 \ubcf4\ub0b4\uae30.",
    voiceUnsupported: "\uc774 \ube0c\ub77c\uc6b0\uc800\ub294 \uc74c\uc131 \uc785\ub825\uc774 \uc548 \ub3fc\uc694 \u2014 \uc0ac\ud30c\ub9ac\ub098 \ud06c\ub86c\uc73c\ub85c \uc5f4\uc5b4 \uc8fc\uc138\uc694.",
    voiceDenied: "\ub9c8\uc774\ud06c \uad8c\ud55c\uc774 \uac70\ubd80\ub410\uc5b4\uc694. \ud0c0\uc774\ud551\uc740 \uadf8\ub300\ub85c \ub3fc\uc694.",
    confirmReset: "\ucc98\uc74c\ubd80\ud130 \ub2e4\uc2dc \uc2dc\uc791\ud560\uae4c\uc694? \uc9c0\uae08 \ub300\ud654\ub294 \uc0ac\ub77c\uc838\uc694.",
    header: "[\ubd81\uadf9\uc131 \uc778\ud130\ubdf0 \u2014 \uc6f9]", started: "\uc2dc\uc791: ", finished: "\uc885\ub8cc: ", took: "\uc18c\uc694: \uc57d ", min: "\ubd84", turns: "\ud134 \uc218: ", me: "\u2500\u2500 \ub098 \u2500\u2500", ai: "\u2500\u2500 \uc778\ud130\ubdf0 \u2500\u2500"
  };
  if (EN) {
    document.documentElement.lang = "en";
    document.title = T.title;
    document.querySelector("header h1").textContent = T.title;
    document.getElementById("subtitle").textContent = T.subtitle;
    input.placeholder = T.placeholder;
    send.textContent = T.send;
    status.textContent = T.starting;
    retry.textContent = T.retry;
    document.getElementById("copy").textContent = T.copy;
    document.getElementById("reset").textContent = T.reset;
  }

  var state = { messages: [], startedAt: null, finishedAt: null, done: false };

  try {
    var saved = localStorage.getItem(KEY);
    if (saved) state = JSON.parse(saved);
  } catch (e) { /* a private window is not a failure */ }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function bubble(role, text) {
    var el = document.createElement("div");
    el.className = "msg " + (role === "user" ? "you" : "guide");
    el.textContent = text;
    log.appendChild(el);
    return el;
  }

  function scroll() {
    requestAnimationFrame(function () {
      log.scrollTop = log.scrollHeight;
      window.scrollTo(0, document.body.scrollHeight);
    });
  }

  function render() {
    log.innerHTML = "";
    for (var i = 0; i < state.messages.length; i++) {
      bubble(state.messages[i].role, state.messages[i].content);
    }
    scroll();
  }

  function setBusy(busy) {
    send.disabled = busy || state.done;
    input.disabled = busy || state.done;
    if (state.done) {
      input.placeholder = T.endedPlaceholder;
    }
  }

  function minutesSoFar() {
    if (!state.startedAt || !state.finishedAt) return null;
    return Math.round((state.finishedAt - state.startedAt) / 60000);
  }

  function showDone() {
    doneBox.classList.remove("hidden");
    var mins = minutesSoFar();
    doneText.textContent = mins === null ? T.done : T.doneMins(mins);
    status.textContent = "";
  }

  function transcript() {
    var out = [T.header];
    if (state.startedAt) out.push(T.started + new Date(state.startedAt).toLocaleString(EN ? "en-US" : "ko-KR"));
    if (state.finishedAt) {
      out.push(T.finished + new Date(state.finishedAt).toLocaleString(EN ? "en-US" : "ko-KR"));
      out.push(T.took + minutesSoFar() + T.min);
    }
    out.push(T.turns + state.messages.length);
    out.push("");
    for (var i = 0; i < state.messages.length; i++) {
      var m = state.messages[i];
      out.push((m.role === "user" ? T.me : T.ai));
      out.push(m.content);
      out.push("");
    }
    return out.join("\n");
  }

  document.getElementById("copy").addEventListener("click", function () {
    var text = transcript();
    var ok = function () { doneText.textContent = T.copied; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, function () { fallbackCopy(text, ok); });
    } else {
      fallbackCopy(text, ok);
    }
  });

  function fallbackCopy(text, ok) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); ok(); } catch (e) {}
    document.body.removeChild(ta);
  }

  document.getElementById("reset").addEventListener("click", function () {
    if (!confirm(T.confirmReset)) return;
    state = { messages: [], startedAt: null, finishedAt: null, done: false };
    save();
    location.reload();
  });

  // ── Input mode: type or speak ─────────────────────────────────────────
  // Speech goes INTO the textarea, never straight to the server: the customer
  // reads what the recognizer heard and presses send — a misheard number in a
  // wish would otherwise be planted as theirs.
  var modeType = document.getElementById("modeType");
  var modeVoice = document.getElementById("modeVoice");
  var voiceBox = document.getElementById("voiceBox");
  var mic = document.getElementById("mic");
  var voiceHint = document.getElementById("voiceHint");
  var MODE_KEY = KEY + ":mode";
  var Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognizer = null, listening = false, baseText = "";

  modeType.textContent = T.modeType;
  modeVoice.textContent = T.modeVoice;
  mic.textContent = T.micIdle;
  voiceHint.textContent = T.voiceHint;
  if (!Recognition) { modeVoice.disabled = true; modeVoice.title = T.voiceUnsupported; }

  function setMode(mode) {
    var voice = mode === "voice" && Recognition;
    modeVoice.classList.toggle("on", !!voice);
    modeType.classList.toggle("on", !voice);
    voiceBox.classList.toggle("hidden", !voice);
    input.placeholder = voice ? T.voiceHint : T.placeholder;
    if (!voice) stopListening();
    try { localStorage.setItem(MODE_KEY, voice ? "voice" : "type"); } catch (e) {}
  }
  modeType.addEventListener("click", function () { setMode("type"); });
  modeVoice.addEventListener("click", function () {
    if (!Recognition) { status.textContent = T.voiceUnsupported; return; }
    setMode("voice");
  });

  function stopListening() {
    if (recognizer && listening) { try { recognizer.stop(); } catch (e) {} }
    listening = false;
    mic.classList.remove("listening");
    mic.textContent = T.micIdle;
  }

  function startListening() {
    if (send.disabled && state.done) return;
    recognizer = new Recognition();
    recognizer.lang = EN ? "en-US" : "ko-KR";
    recognizer.continuous = true;
    recognizer.interimResults = true;
    baseText = input.value ? input.value.replace(/\s+$/, "") + " " : "";
    recognizer.onresult = function (e) {
      var finalText = "", interim = "";
      for (var i = 0; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      input.value = baseText + finalText + interim;
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, window.innerHeight * 0.4) + "px";
    };
    recognizer.onerror = function (e) {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") status.textContent = T.voiceDenied;
      stopListening();
    };
    recognizer.onend = function () { if (listening) stopListening(); };
    try { recognizer.start(); } catch (e) { stopListening(); return; }
    listening = true;
    mic.classList.add("listening");
    mic.textContent = T.micOn;
  }

  mic.addEventListener("click", function () { listening ? stopListening() : startListening(); });

  var savedMode = null;
  try { savedMode = localStorage.getItem(MODE_KEY); } catch (e) {}
  setMode(savedMode === "voice" ? "voice" : "type");

  input.addEventListener("input", function () {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, window.innerHeight * 0.4) + "px";
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && window.innerWidth > 760) {
      e.preventDefault();
      submit();
    }
  });

  send.addEventListener("click", submit);

  function submit() {
    stopListening();
    var text = input.value.trim();
    if (!text || send.disabled) return;
    input.value = "";
    input.style.height = "auto";
    state.messages.push({ role: "user", content: text });
    save();
    bubble("user", text);
    scroll();
    turn();
  }

  // The first turn has no message of the customer's to re-send, so a failure
  // there would leave a page with nothing to press. This is that door.
  retry.addEventListener("click", function () {
    retry.classList.add("hidden");
    // A mid-interview failure puts the customer's own words back in the box —
    // re-sending those is the retry. Only the kickoff has nothing to re-send.
    if (input.value.trim()) submit();
    else turn();
  });

  function turn() {
    setBusy(true);
    retry.classList.add("hidden");
    status.textContent = T.listening;

    var el = bubble("assistant", "");
    var caret = document.createElement("span");
    caret.className = "cursor";
    el.appendChild(caret);
    scroll();

    var shown = "";
    var committed = false;

    fetch("https://fklraktutiifoconcvfx.supabase.co/functions/v1/north-star-web", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: state.messages, language: language })
    }).then(function (res) {
      if (!res.ok || !res.body) {
        return res.json().catch(function () { return {}; }).then(function (body) {
          throw new Error(body.error || ("HTTP " + res.status));
        });
      }
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buffer = "";

      function pump() {
        return reader.read().then(function (result) {
          if (result.done) return;
          buffer += decoder.decode(result.value, { stream: true });
          var frames = buffer.split("\n\n");
          buffer = frames.pop();
          for (var i = 0; i < frames.length; i++) {
            var line = frames[i].trim();
            if (line.indexOf("data: ") !== 0) continue;
            var evt;
            try { evt = JSON.parse(line.slice(6)); } catch (e) { continue; }

            if (evt.type === "delta") {
              shown += evt.text;
              el.textContent = shown;
              el.appendChild(caret);
              scroll();
            } else if (evt.type === "done") {
              // The stream's own text is the turn — never the accumulated
              // deltas. A torn stream would otherwise commit half a sentence
              // and every later turn would continue from it.
              committed = true;
              el.textContent = evt.text;
              state.messages.push({ role: "assistant", content: evt.text });
              if (!state.startedAt) state.startedAt = Date.now();
              if (evt.complete) {
                state.done = true;
                state.finishedAt = Date.now();
              }
              save();
            } else if (evt.type === "error") {
              throw new Error(evt.message || "stream error");
            }
          }
          return pump();
        });
      }
      return pump();
    }).then(function () {
      if (!committed) throw new Error("연결이 끊겼어요");
      caret.remove();
      setBusy(false);
      status.textContent = "";
      if (state.done) showDone();
      else input.focus();
      scroll();
    }).catch(function (err) {
      caret.remove();
      if (!committed) el.remove();
      setBusy(false);
      status.textContent = String(err.message || err);
      retry.classList.remove("hidden");
      // Nothing was committed, so the same message can simply be sent again.
      if (state.messages.length && state.messages[state.messages.length - 1].role === "user" && !committed) {
        var last = state.messages.pop();
        save();
        var nodes = log.querySelectorAll(".msg.you");
        if (nodes.length) nodes[nodes.length - 1].remove();
        input.value = last.content;
      }
    });
  }

  render();
  if (state.done) {
    setBusy(true);
    showDone();
  } else if (state.messages.length === 0) {
    turn();
  } else {
    setBusy(false);
    status.textContent = "";
  }
})();
</script>
</body>
</html>
