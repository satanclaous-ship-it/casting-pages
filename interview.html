<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>북극성 인터뷰</title>
<style>
  :root {
    --bg: #07080d;
    --ink: #eef0f6;
    --dim: #8b90a3;
    --line: #1c1f2b;
    --you: #12141d;
    --accent: #cbb98a;
  }
  * { box-sizing: border-box; -webkit-text-size-adjust: 100%; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
      "Noto Sans KR", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.7;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 22px 20px 14px;
    border-bottom: 1px solid var(--line);
    text-align: center;
  }
  h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  header p {
    margin: 6px 0 0;
    font-size: 13px;
    color: var(--dim);
  }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px 8px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    -webkit-overflow-scrolling: touch;
  }
  .msg { margin: 0 0 22px; white-space: pre-wrap; word-break: break-word; }
  .msg.you {
    background: var(--you);
    border-radius: 14px;
    padding: 12px 15px;
    margin-left: auto;
    max-width: 85%;
    color: #d8dbe6;
  }
  .msg.guide { max-width: 100%; }
  .cursor {
    display: inline-block;
    width: 7px; height: 15px;
    background: var(--accent);
    opacity: 0.8;
    animation: blink 1.1s steps(2, start) infinite;
    vertical-align: -2px;
  }
  @keyframes blink { to { visibility: hidden; } }
  footer {
    border-top: 1px solid var(--line);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1;
    resize: none;
    background: var(--you);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 13px;
    font: inherit;
    line-height: 1.55;
    max-height: 40vh;
    min-height: 46px;
  }
  textarea:focus { outline: none; border-color: #33384a; }
  button {
    font: inherit;
    font-size: 15px;
    border: none;
    border-radius: 12px;
    padding: 12px 18px;
    background: var(--accent);
    color: #12121a;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.35; cursor: default; }
  .status {
    font-size: 12.5px;
    color: var(--dim);
    text-align: center;
    padding: 6px 4px 0;
    min-height: 20px;
  }
  .done {
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    margin: 6px 0 22px;
    text-align: center;
  }
  .done p { margin: 0 0 14px; font-size: 14px; color: var(--dim); }
  .ghost {
    background: transparent;
    color: var(--dim);
    border: 1px solid var(--line);
    font-size: 13px;
    padding: 9px 14px;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>북극성 인터뷰</h1>
  <p>열두 번의 질문으로, 원하는 것을 손에 잡히는 문장으로</p>
</header>

<main id="log"></main>

<footer>
  <div id="doneBox" class="done hidden">
    <p id="doneText">인터뷰가 끝났어요.</p>
    <button id="copy" class="ghost">대화 전체 복사</button>
    <button id="reset" class="ghost">처음부터</button>
  </div>
  <div class="row">
    <textarea id="input" rows="1" placeholder="편하게 적어 주세요" autocomplete="off"></textarea>
    <button id="send" disabled>보내기</button>
  </div>
  <div class="status" id="status">시작하는 중이에요…</div>
  <div style="text-align:center; padding-top:8px;">
    <button id="retry" class="ghost hidden">다시 시도</button>
  </div>
</footer>

<script>
(function () {
  var KEY = "north-star-web-v1";
  var log = document.getElementById("log");
  var input = document.getElementById("input");
  var send = document.getElementById("send");
  var status = document.getElementById("status");
  var doneBox = document.getElementById("doneBox");
  var doneText = document.getElementById("doneText");
  var retry = document.getElementById("retry");

  var params = new URLSearchParams(location.search);
  var language = params.get("lang") === "en" ? "English" : "Korean";

  var state = { messages: [], startedAt: null, finishedAt: null, done: false };

  try {
    var saved = localStorage.getItem(KEY);
    if (saved) state = JSON.parse(saved);
  } catch (e) { /* a private window is not a failure */ }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function bubble(role, text) {
    var el = document.createElement("div");
    el.className = "msg " + (role === "user" ? "you" : "guide");
    el.textContent = text;
    log.appendChild(el);
    return el;
  }

  function scroll() {
    requestAnimationFrame(function () {
      log.scrollTop = log.scrollHeight;
      window.scrollTo(0, document.body.scrollHeight);
    });
  }

  function render() {
    log.innerHTML = "";
    for (var i = 0; i < state.messages.length; i++) {
      bubble(state.messages[i].role, state.messages[i].content);
    }
    scroll();
  }

  function setBusy(busy) {
    send.disabled = busy || state.done;
    input.disabled = busy || state.done;
    if (state.done) {
      input.placeholder = "인터뷰가 끝났어요";
    }
  }

  function minutesSoFar() {
    if (!state.startedAt || !state.finishedAt) return null;
    return Math.round((state.finishedAt - state.startedAt) / 60000);
  }

  function showDone() {
    doneBox.classList.remove("hidden");
    var mins = minutesSoFar();
    doneText.textContent = mins === null
      ? "인터뷰가 끝났어요. 카드를 캡처해 두셔도 좋아요."
      : "인터뷰가 끝났어요 (약 " + mins + "분). 카드를 캡처해 두셔도 좋아요.";
    status.textContent = "";
  }

  function transcript() {
    var out = ["[북극성 인터뷰 — 웹]"];
    if (state.startedAt) out.push("시작: " + new Date(state.startedAt).toLocaleString("ko-KR"));
    if (state.finishedAt) {
      out.push("종료: " + new Date(state.finishedAt).toLocaleString("ko-KR"));
      out.push("소요: 약 " + minutesSoFar() + "분");
    }
    out.push("턴 수: " + state.messages.length);
    out.push("");
    for (var i = 0; i < state.messages.length; i++) {
      var m = state.messages[i];
      out.push((m.role === "user" ? "── 나 ──" : "── 인터뷰 ──"));
      out.push(m.content);
      out.push("");
    }
    return out.join("\n");
  }

  document.getElementById("copy").addEventListener("click", function () {
    var text = transcript();
    var ok = function () { doneText.textContent = "복사됐어요. 보내주시면 돼요."; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, function () { fallbackCopy(text, ok); });
    } else {
      fallbackCopy(text, ok);
    }
  });

  function fallbackCopy(text, ok) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); ok(); } catch (e) {}
    document.body.removeChild(ta);
  }

  document.getElementById("reset").addEventListener("click", function () {
    if (!confirm("처음부터 다시 시작할까요? 지금 대화는 사라져요.")) return;
    state = { messages: [], startedAt: null, finishedAt: null, done: false };
    save();
    location.reload();
  });

  input.addEventListener("input", function () {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, window.innerHeight * 0.4) + "px";
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && window.innerWidth > 760) {
      e.preventDefault();
      submit();
    }
  });

  send.addEventListener("click", submit);

  function submit() {
    var text = input.value.trim();
    if (!text || send.disabled) return;
    input.value = "";
    input.style.height = "auto";
    state.messages.push({ role: "user", content: text });
    save();
    bubble("user", text);
    scroll();
    turn();
  }

  // The first turn has no message of the customer's to re-send, so a failure
  // there would leave a page with nothing to press. This is that door.
  retry.addEventListener("click", function () {
    retry.classList.add("hidden");
    // A mid-interview failure puts the customer's own words back in the box —
    // re-sending those is the retry. Only the kickoff has nothing to re-send.
    if (input.value.trim()) submit();
    else turn();
  });

  function turn() {
    setBusy(true);
    retry.classList.add("hidden");
    status.textContent = "듣고 있어요…";

    var el = bubble("assistant", "");
    var caret = document.createElement("span");
    caret.className = "cursor";
    el.appendChild(caret);
    scroll();

    var shown = "";
    var committed = false;

    fetch("https://fklraktutiifoconcvfx.supabase.co/functions/v1/north-star-web", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: state.messages, language: language })
    }).then(function (res) {
      if (!res.ok || !res.body) {
        return res.json().catch(function () { return {}; }).then(function (body) {
          throw new Error(body.error || ("HTTP " + res.status));
        });
      }
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buffer = "";

      function pump() {
        return reader.read().then(function (result) {
          if (result.done) return;
          buffer += decoder.decode(result.value, { stream: true });
          var frames = buffer.split("\n\n");
          buffer = frames.pop();
          for (var i = 0; i < frames.length; i++) {
            var line = frames[i].trim();
            if (line.indexOf("data: ") !== 0) continue;
            var evt;
            try { evt = JSON.parse(line.slice(6)); } catch (e) { continue; }

            if (evt.type === "delta") {
              shown += evt.text;
              el.textContent = shown;
              el.appendChild(caret);
              scroll();
            } else if (evt.type === "done") {
              // The stream's own text is the turn — never the accumulated
              // deltas. A torn stream would otherwise commit half a sentence
              // and every later turn would continue from it.
              committed = true;
              el.textContent = evt.text;
              state.messages.push({ role: "assistant", content: evt.text });
              if (!state.startedAt) state.startedAt = Date.now();
              if (evt.complete) {
                state.done = true;
                state.finishedAt = Date.now();
              }
              save();
            } else if (evt.type === "error") {
              throw new Error(evt.message || "stream error");
            }
          }
          return pump();
        });
      }
      return pump();
    }).then(function () {
      if (!committed) throw new Error("연결이 끊겼어요");
      caret.remove();
      setBusy(false);
      status.textContent = "";
      if (state.done) showDone();
      else input.focus();
      scroll();
    }).catch(function (err) {
      caret.remove();
      if (!committed) el.remove();
      setBusy(false);
      status.textContent = String(err.message || err);
      retry.classList.remove("hidden");
      // Nothing was committed, so the same message can simply be sent again.
      if (state.messages.length && state.messages[state.messages.length - 1].role === "user" && !committed) {
        var last = state.messages.pop();
        save();
        var nodes = log.querySelectorAll(".msg.you");
        if (nodes.length) nodes[nodes.length - 1].remove();
        input.value = last.content;
      }
    });
  }

  render();
  if (state.done) {
    setBusy(true);
    showDone();
  } else if (state.messages.length === 0) {
    turn();
  } else {
    setBusy(false);
    status.textContent = "";
  }
})();
</script>
</body>
</html>
